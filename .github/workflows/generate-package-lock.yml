name: Finalize audit artifacts

on:
  push:
    branches: [fix/audit-complete-f20-f26]

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
      - name: Refresh lock metadata and remove audited orphan CSS
        run: |
          set -euo pipefail
          node --version
          npm --version
          npm install --package-lock-only --ignore-scripts
          node scripts/check-orphan-css.mjs --fix
          node scripts/check-orphan-css.mjs
      - name: Commit generated changes when needed
        run: |
          set -euo pipefail
          if git diff --quiet -- package-lock.json src/app/globals.css; then
            echo "Generated artifacts already finalized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json src/app/globals.css
          git commit -m "build: finalize reproducible lockfile and CSS cleanup"
          git push origin HEAD:fix/audit-complete-f20-f26
