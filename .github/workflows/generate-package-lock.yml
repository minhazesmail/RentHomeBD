name: Generate package lock

on:
  push:
    branches: [fix/audit-complete-f20-f26]

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Persist package lock once
        run: |
          set -euo pipefail
          if [ -f package-lock.json ]; then
            echo "package-lock.json already exists; nothing to do."
            exit 0
          fi
          node --version
          npm --version
          npm install --package-lock-only --ignore-scripts
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "build: add reproducible npm lockfile"
          git push origin HEAD:fix/audit-complete-f20-f26
