name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      NEXT_PUBLIC_SUPABASE_URL: https://naoarepmcfdnxehbdios.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_Af21QWd3B7XLt_4TmoWEQw_deZseDwD
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Install Chromium for theme QA
        run: npx playwright install --with-deps chromium
      - name: Typecheck
        run: npm run typecheck
      - name: Localization QA
        run: npm run i18nqa
      - name: Lint
        run: npm run lint
      - name: Dead code
        run: npm run deadcode
      - name: UI regression QA
        run: npm run uiqa
      - name: Build
        run: npm run build
      - name: Start production server
        run: |
          npm run start > /tmp/nearbasha-next.log 2>&1 &
          echo $! > /tmp/nearbasha-next.pid
          for i in {1..45}; do
            if curl --fail --silent http://127.0.0.1:3000/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/nearbasha-next.log
          exit 1
      - name: Rendered theme QA
        run: npm run themebrowser
      - name: How-it-works dark theme QA
        run: node scripts/check-how-theme-browser.mjs
      - name: Upload theme QA artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: theme-browser-${{ github.run_id }}
          path: artifacts/theme-browser
          if-no-files-found: ignore
          retention-days: 14
